<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emmanuel Anu Thompson — Transportation & Supply Chain Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2230; --muted:#5d6577; --navy:#1f3a5f; --navy-2:#15293f; --gold:#b8862f; --gold-soft:#f3e8d2;
  --paper:#faf8f4; --card:#ffffff; --line:#e7e1d5; --ok:#2f7a4f; --err:#a33a3a;
  --serif:'Fraunces', Georgia, serif; --sans:'Source Sans 3', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6}
a{color:var(--navy);text-decoration-color:rgba(31,58,95,.35);text-underline-offset:3px}
a:hover{color:var(--gold)}
h1,h2,h3,h4{font-family:var(--serif);color:var(--navy-2);line-height:1.2;margin:0 0 .5em}
h2{font-size:1.9rem;font-weight:600}
h3{font-size:1.25rem;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* Masthead */
.masthead{background:var(--navy-2);color:#fff}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:1.35rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.brand small{display:block;font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#c9d3e2;margin-top:2px}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:#dfe6f0;text-decoration:none;padding:7px 12px;border-radius:4px;font-weight:500;font-size:.95rem}
nav.main a:hover{background:rgba(255,255,255,.08);color:#fff}
nav.main a.active{background:var(--gold);color:#fff}
.goldbar{height:4px;background:linear-gradient(90deg,var(--gold),#d9b46a,var(--gold))}

/* Hero */
.hero{background:linear-gradient(180deg,#fff, var(--paper));border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:center;padding-top:48px;padding-bottom:44px}
.photo{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 6px 24px rgba(21,41,63,.15);background:var(--navy);display:flex;align-items:center;justify-content:center}
.photo .mono{font-family:var(--serif);color:#fff;font-size:4rem;letter-spacing:2px}
.hero h1{font-size:2.6rem;font-weight:700;margin-bottom:.15em}
.hero .role{font-size:1.1rem;color:var(--gold);font-weight:600;margin-bottom:.6em}
.hero .tagline{font-size:1.12rem;color:var(--muted);max-width:640px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:.9rem;text-decoration:none;color:var(--navy);font-weight:500}
.pill:hover{border-color:var(--gold);color:var(--gold)}

main{padding:44px 0 60px}
.section{margin-bottom:48px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:6px;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.section-head h2{margin:0}
.section-head .aside{color:var(--muted);font-size:.9rem}
.lead p{margin:0 0 1em}

.two{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 36px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:2rem;color:var(--navy)}
.stat span{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Feature blocks like the reference: heading + thumbnail + read more */
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.feature{display:grid;grid-template-columns:96px 1fr;gap:18px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;align-items:start;transition:box-shadow .2s, transform .2s}
.feature:hover{box-shadow:0 8px 24px rgba(21,41,63,.08);transform:translateY(-2px)}
.feature .thumb{width:96px;height:96px;border-radius:6px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.feature h3{margin-bottom:.3em}
.feature p{margin:0 0 .5em;color:var(--muted);font-size:.95rem}
.more{font-weight:600;text-decoration:none;color:var(--gold)}
.more:hover{text-decoration:underline}

.news{list-style:none;padding:0;margin:0}
.news li{padding:12px 0;border-bottom:1px dashed var(--line);font-size:.96rem}
.news .date{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700}
.sidebox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--gold-soft);color:#6d4f17;border-radius:4px;padding:3px 10px;font-size:.85rem;font-weight:500}

/* Entries */
.entry{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.entry .t{font-weight:700;color:var(--navy-2)}
.entry .s{color:var(--muted);font-style:italic}
.entry .d{color:var(--muted);font-size:.9rem;text-align:right;white-space:nowrap}
.entry ul{grid-column:1/-1;margin:6px 0 0;padding-left:20px}
.entry ul li{margin-bottom:3px}
.meta{grid-column:1/-1;font-size:.88rem;color:var(--muted)}

/* Publications */
.pubtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.pubtools input{flex:1;min-width:200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.9rem;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pub{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pub .lab{font-weight:700;color:var(--gold);font-size:.9rem;padding-top:2px}
.pub .ti{font-weight:600;color:var(--navy-2)}
.pub .au{font-size:.95rem}
.pub .ve{font-style:italic;color:var(--muted);font-size:.95rem}
.pub .lk{font-size:.85rem;margin-top:2px}
.yeargroup{font-family:var(--serif);font-size:1.3rem;color:var(--navy);margin:24px 0 2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.skill{padding:10px 0;border-bottom:1px solid var(--line)}
.skill b{color:var(--navy-2)}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;max-width:640px}
.contact-card dt{font-weight:700;color:var(--navy);margin-top:12px}
.contact-card dd{margin:0}

footer{background:var(--navy-2);color:#c9d3e2;padding:28px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer a{color:#e6ecf4;text-decoration:none;margin-right:14px}
footer a:hover{color:var(--gold)}
.hidden{display:none!important}

/* Forms / admin */
input,textarea,select{font:inherit;font-size:.95rem;border:1px solid #d6cfc0;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.btn{font:inherit;font-weight:600;font-size:.92rem;border-radius:6px;padding:8px 16px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:#f1efe9}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.danger{background:#fff;color:var(--err);border-color:#e3c4c4}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
.admin>*,.row2>*,.item-head .ttl{min-width:0}
.admin-nav{position:sticky;top:16px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.admin-nav button{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink)}
.admin-nav button:hover{background:#f4f1ea}
.admin-nav button.on{background:var(--navy);color:#fff}
.admin-nav .count{float:right;font-size:.8rem;opacity:.7}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px}
.item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fdfcf9}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item-head .ttl{font-weight:600;color:var(--navy-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .acts{display:flex;gap:6px;flex-shrink:0}
.item-body{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.savebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-soft);border:1px solid #e6d3ad;border-radius:8px;padding:10px 16px;margin-bottom:20px;flex-wrap:wrap}
.status{font-size:.9rem;font-weight:600}
.status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.dirty{color:#8a5a00}
.notice{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:16px 20px;margin-bottom:20px}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:10px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.photo-edit{display:flex;gap:18px;align-items:center}
.photo-edit .photo{width:110px;height:110px;border-width:3px}
.photo-edit .photo .mono{font-size:2rem}

.crop-view{position:relative;width:300px;height:300px;max-width:100%;margin:0 auto;overflow:hidden;border-radius:8px;background:#1b2230;touch-action:none;cursor:grab;user-select:none}
.crop-view:active{cursor:grabbing}
.crop-view img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.crop-ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(10,16,26,.55);border:2px solid rgba(255,255,255,.85);pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:10px;margin:16px auto 0;max-width:300px}
.crop-zoom input{padding:0}

/* ===== Banner header (striped, Fiona-Moore style) ===== */
.topbar{background:#0a1a2a;color:#b9c7d8;font-size:.82rem}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live b{color:#fff;font-weight:600}
.live .sep{opacity:.4}
.pulse{width:8px;height:8px;border-radius:50%;background:#3fbf7f;box-shadow:0 0 0 0 rgba(63,191,127,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,127,.6)}70%{box-shadow:0 0 0 8px rgba(63,191,127,0)}100%{box-shadow:0 0 0 0 rgba(63,191,127,0)}}
.live-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status-pill{background:rgba(63,191,127,.15);color:#8fe0b5;border:1px solid rgba(63,191,127,.35);border-radius:999px;padding:2px 10px;font-weight:600}
.banner{position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(ellipse at 85% 10%,rgba(255,255,255,.14),transparent 55%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.075) 0 38px,transparent 38px 92px),
    linear-gradient(180deg,#0f5d8c 0%,#0a4a72 100%)}
.banner .net{position:absolute;right:0;top:0;height:100%;width:62%;opacity:.55;pointer-events:none}
.banner-in{position:relative;display:flex;align-items:center;min-height:190px;padding-top:24px;padding-bottom:24px}
.logo{display:flex;align-items:center;gap:18px;color:#fff;text-decoration:none}
.logo:hover{color:#fff}
.logo svg{flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.bn{display:block;font-family:var(--serif);font-size:3rem;font-weight:500;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.bs{display:block;margin-top:8px;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:#cfe0ee}
.navbar{background:linear-gradient(180deg,#30282a 0%,#1a1415 100%);border-top:1px solid #4a3d3f;box-shadow:0 2px 0 #a8781c}
.navbar .wrap{display:flex;padding:0}
.navbar a{flex:1;text-align:center;color:#eee;text-decoration:none;padding:12px 6px;font-size:.95rem;font-weight:500;border-right:1px solid rgba(255,255,255,.12);position:relative;transition:background .2s,color .2s}
.navbar a:first-child{border-left:1px solid rgba(255,255,255,.12)}
.navbar a:hover{background:rgba(255,255,255,.06);color:#fff}
.navbar a.active{color:#e9bf62}
.navbar a.active::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:#e9bf62;border-radius:3px 3px 0 0}
.ticker{background:#fff;border-bottom:1px solid var(--line)}
.ticker-in{display:flex;align-items:center;gap:14px;padding-top:8px;padding-bottom:8px}
.tk-lab{flex-shrink:0;background:#a8781c;color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:3px}
.tk-view{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk-track{display:inline-flex;gap:48px;white-space:nowrap;animation:tick 60s linear infinite;font-size:.92rem}
.tk-track:hover{animation-play-state:paused}
.tk-track span b{color:var(--gold);margin-right:6px;font-weight:700}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ===== Charts & graphics ===== */
.chart-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.chart-card h3{margin-bottom:2px}
.chart-sub{color:var(--muted);font-size:.88rem;margin-bottom:12px}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--sans);fill:#6b7280;font-size:11px}
svg.chart .val{fill:#1c2230;font-weight:600}
svg.chart .hit{fill:transparent;cursor:pointer}
svg.chart .bar{transition:opacity .15s}
svg.chart g.mark:hover .bar{opacity:.8}
.tip{position:fixed;z-index:60;pointer-events:none;background:#15293f;color:#fff;font-size:.82rem;padding:6px 10px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .1s;max-width:260px}
.tip.on{opacity:1}
.impact{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.impact-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.impact-nums div{background:#f6f3ec;border-radius:8px;padding:12px;text-align:center}
.impact-nums b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--navy)}
.impact-nums span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.src{font-size:.8rem;color:var(--muted);margin-top:10px}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2f7a4f;background:#e6f4ec;border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:middle}
.livebadge .pulse{width:6px;height:6px}
.cites{display:inline-block;font-size:.78rem;font-weight:700;color:#2f7a4f;background:#e6f4ec;border-radius:4px;padding:1px 8px;margin-left:8px}
.journey{background:linear-gradient(180deg,#0f5d8c,#0a4a72);border-radius:12px;padding:22px;color:#fff;position:relative;overflow:hidden}
.journey::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 30px,transparent 30px 70px)}
.journey h3{color:#fff;position:relative}
.journey svg{position:relative;width:100%;height:auto;display:block}
.stat b.counting{color:var(--navy)}
@media (prefers-reduced-motion:reduce){.tk-track,.pulse{animation:none}.banner .net animateMotion{display:none}}
@media (max-width:820px){
  .bn{font-size:2rem}.banner .net{width:100%;opacity:.25}.banner-in{min-height:140px}
  .navbar .wrap{flex-wrap:wrap}.navbar a{flex:1 1 33%;border-bottom:1px solid rgba(255,255,255,.08)}
  .impact{grid-template-columns:1fr}
}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
  .pills{justify-content:center}
  .two,.grid2,.features,.admin{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .entry{grid-template-columns:1fr}.entry .d{text-align:left}
  .row2{grid-template-columns:1fr}
  .admin-nav{position:static}
  .hero h1{font-size:2rem}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="live"><span class="pulse"></span><b>Live</b><span class="sep">|</span><span id="lvLoc">Fargo, ND</span><span class="sep">·</span><span id="lvClock">—</span><span class="sep">·</span><span id="lvWx">loading weather…</span></div>

</div></div>
<header class="banner">

      <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">

</header>
<nav class="navbar"><div class="wrap" id="mainNav"></div></nav>
<div class="ticker"><div class="wrap ticker-in"><span class="tk-lab">Latest</span><div class="tk-view"><div class="tk-track" id="ticker"></div></div></div></div>
<div class="tip" id="tip"></div>

<div id="app"></div>

<footer>
  <div class="wrap">
    <div id="footNav"></div>
    <div><span id="copy"></span> · <a href="#admin" style="margin:0">Admin</a></div>
  </div>
</footer>

<script>
/* ===================== DEFAULT CONTENT (from CV) ===================== */
const DEFAULT = {
  profile:{
    name:"Emmanuel Anu Thompson",
    shortName:"EA Thompson",

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""}

function boldMe(a){return esc(a).replace(/(Thompson,\s*E\.\s*A\.?)/g,"<strong>$1</strong>")}

/* ===================== ROUTING ===================== */
const PAGES=[["home","Home"],["research","Research"],["publications","Publications"],["teaching","Teaching"],["cv","CV"],["contact","Contact"]];
function route(){return (location.hash||"#home").slice(1)||"home"}
function navHtml(cur){return PAGES.map(([k,l])=>`<a href="#${k}" class="${cur===k?"active":""}">${l}</a>`).join("")}

function render(){
  const r=route();
  const p=data.profile;
  $("#mainNav").innerHTML=navHtml(r);
  $("#footNav").innerHTML=PAGES.map(([k,l])=>`<a href="#${k}">${l}</a>`).join("");
  $("#copy").textContent="© "+new Date().getFullYear()+" "+(p.name||"");
  $("#brandName").textContent=p.name||"";
  $("#lvStatus").textContent=p.status||""; $("#lvStatus").style.display=p.status?"":"none";
  $("#lvLoc").textContent=p.location?p.location.replace(/,\s*USA$/,""):"";
  const tk=data.news.map(n=>`<span><b>${esc(n.date)}</b>${esc(n.text)}</span>`).join("");
  $("#ticker").innerHTML=tk+tk;
  const app=$("#app");
  const views={home:viewHome,research:viewResearch,publications:viewPubs,teaching:viewTeaching,cv:viewCV,contact:viewContact,admin:viewAdmin};
  app.innerHTML=(views[r]||viewHome)();
  if(r==="publications") bindPubs();
  if(r==="home") countUp();
  if(r==="admin") bindAdmin();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

function photoHtml(cls="photo"){
  const p=data.profile;
  if(p.photo && p.photo.startsWith("data:image/")) return `<img class="${cls}" src="${p.photo}" alt="${esc(p.name)}">`;
  const ini=(p.name||"").split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,3).join("");
  return `<div class="${cls}"><span class="mono">${esc(ini)}</span></div>`;
}
function linkPills(){
  const p=data.profile, out=[];
  if(p.email) out.push(`<a class="pill" href="mailto:${esc(p.email)}">✉ ${esc(p.email)}</a>`);
  if(safeUrl(p.scholar)) out.push(`<a class="pill" href="${esc(p.scholar)}" target="_blank" rel="noopener">Google Scholar</a>`);
  if(safeUrl(p.orcid)) out.push(`<a class="pill" href="${esc(p.orcid)}" target="_blank" rel="noopener">ORCID</a>`);
  if(safeUrl(p.linkedin)) out.push(`<a class="pill" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
  return out.join("");
}

const C_J="#1f5f8f", C_C="#a8781c";
function topRounded(x,y,w,h,r){r=Math.min(r,h,w/2);if(h<=0)return"";return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function rightRounded(x,y,w,h,r){r=Math.min(r,w,h/2);if(w<=0)return"";return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`}
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=2?2:n<=5?5:10)*p}
function vBars(cats,series,{H=220,tipFn}={}){
  const W=520,ml=30,mr=8,mt=18,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const tot=cats.map((_,i)=>series.reduce((a,s)=>a+s.values[i],0));
  const max=niceMax(Math.max(1,...tot));
  const bw=Math.min(46,iw/cats.length*0.6), step=iw/cats.length;
  let g="";
  for(let k=0;k<=4;k++){const v=max*k/4,y=mt+ih-ih*v/max;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#ece7dc"/><text x="${ml-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`}
  cats.forEach((c,i)=>{
    const x=ml+step*i+(step-bw)/2; let y0=mt+ih; let marks="";
    const live=series.filter(s=>s.values[i]>0); 
    series.forEach((s,si)=>{const v=s.values[i]; if(!v) return; const h=ih*v/max; const top=s===live[live.length-1];
      const y=y0-h; marks+= top?`<path class="bar" d="${topRounded(x,y,bw,h-(si>0&&live.indexOf(s)>0?0:0),4)}" fill="${s.color}"/>`:`<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h-2)}" fill="${s.color}"/>`;
      y0=y;});
    const tip=tipFn?tipFn(i):"";
    g+=`<g class="mark" data-tip="${esc(tip)}">${marks}<rect class="hit" x="${ml+step*i}" y="${mt}" width="${step}" height="${ih}"/>${tot[i]?`<text class="val" x="${x+bw/2}" y="${y0-5}" text-anchor="middle">${tot[i]}</text>`:""}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(c)}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function pubsByYearChart(){
  const ps=data.publications.filter(x=>/^\d{4}$/.test(String(x.year).trim()));
  if(!ps.length) return `<p class="chart-sub">Add publications with a year to see this chart.</p>`;
  const ys=ps.map(x=>+x.year); const lo=Math.min(...ys), hi=Math.max(...ys);
  const cats=[];for(let y=lo;y<=hi;y++)cats.push(String(y));
  const j=cats.map(y=>ps.filter(x=>x.year==y&&x.type==="journal").length);
  const c=cats.map(y=>ps.filter(x=>x.year==y&&x.type!=="journal").length);
  return vBars(cats,[{name:"Journal",color:C_J,values:j},{name:"Conference",color:C_C,values:c}],{tipFn:i=>`${cats[i]}: ${j[i]} journal · ${c[i]} conference`});
}
const THEMES=[["Autonomous trucks",/autonomous|truck|platoon/i],["Ports & maritime",/port|container|maritime/i],["Digital twins & digital logistics",/digital|internet of things|platform/i],["Supply chain & resilience",/supply chain|resilien/i],["Rail & safety",/rail|crossing|crash|injur/i],["Hazardous materials",/hazmat|hazardous/i],["Sustainability & policy",/sustainab|decarboni|emission|policy|inclusive/i],["Agriculture & rural freight",/agricultur|rural/i],["Travel demand & economics",/elasticity|econom|cost|gasoline|demand/i]];
function themesChart(){
  const rows=THEMES.map(([n,re])=>[n,data.publications.filter(x=>re.test(x.title)).length]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  const W=520,rowH=26,ml=190,mr=34,H=rows.length*rowH+6, max=Math.max(1,...rows.map(r=>r[1]));
  let g="";
  rows.forEach(([n,v],i)=>{const y=i*rowH+4,w=(W-ml-mr)*v/max;
    g+=`<g class="mark" data-tip="${esc(n)}: ${v} paper${v>1?"s":""}"><text x="${ml-8}" y="${y+14}" text-anchor="end" style="fill:#1c2230">${esc(n)}</text><path class="bar" d="${rightRounded(ml,y+2,w,16,4)}" fill="${C_J}"/><text class="val" x="${ml+w+6}" y="${y+14}">${v}</text><rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}"/></g>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function impactHtml(){
  const L=live.metrics;
  if(live.state==="loading") return `<p class="chart-sub">Fetching live citation data…</p>`;
  if(!L) return `<p class="chart-sub">Live citation data is unavailable right now. Please check back later, or see <a href="${esc(data.profile.scholar)}" target="_blank" rel="noopener">Google Scholar</a>.</p>`;
  const yrs=L.byYear;
  const now=new Date().getFullYear();
  const chart=yrs.length?vBars(yrs.map(r=>r.year==now?r.year+"*":String(r.year)),[{name:"Citations",color:C_J,values:yrs.map(r=>r.c)}],{H:200,tipFn:i=>`${yrs[i].year}${yrs[i].year==now?" (so far)":""}: ${yrs[i].c} citations`}):`<p class="chart-sub">No yearly citation data yet.</p>`;
  return `<div class="impact">

  <div class="src">Source: <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a> open scholarly index, fetched live when this page loads (${esc(L.when)}). Counts can differ from Google Scholar.</div>`;
}
function journeySvg(){
  const stops=data.education.slice().reverse();
  if(!stops.length) return "";
  const W=900,H=210,pad=110, step=stops.length>1?(W-2*pad)/(stops.length-1):0, y=78;
  const xs=stops.map((_,i)=>pad+i*step);
  let path=`M${xs[0]},${y}`; for(let i=1;i<xs.length;i++){const mx=(xs[i-1]+xs[i])/2;path+=` Q${mx},${y-55} ${xs[i]},${y}`}
  let g=`<path id="jpath" d="${path}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/></path>`;
  g+=`<g><circle r="7" fill="#e9bf62"/><circle r="12" fill="none" stroke="#e9bf62" stroke-opacity=".5"/><animateMotion dur="${4*stops.length}s" repeatCount="indefinite" rotate="auto"><mpath href="#jpath"/></animateMotion></g>`;
  stops.forEach((s,i)=>{const x=xs[i];
    const place=String(s.location||s.institution).split(",")[0];
    const deg=String(s.degree).replace(/ in .*/,"");
    g+=`<circle cx="${x}" cy="${y}" r="16" fill="#0a3c5e" stroke="#e9bf62" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Source Sans 3,sans-serif">${i+1}</text>
    <text x="${x}" y="${y+42}" text-anchor="middle" fill="#fff" font-size="19" font-family="Fraunces,serif">${esc(place)}</text>
    <text x="${x}" y="${y+64}" text-anchor="middle" fill="#e9bf62" font-size="14" font-weight="600" font-family="Source Sans 3,sans-serif">${esc(deg)}</text>
    <text x="${x}" y="${y+84}" text-anchor="middle" fill="#cfe0ee" font-size="13" font-family="Source Sans 3,sans-serif">${esc(s.dates)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Journey from ${stops.map(s=>esc(String(s.location).split(",")[0])).join(" to ")}">${g}</svg>`;
}
function countUp(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(!to)return;const t0=performance.now();
    const f=t=>{const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}

function ago(d){const s=(Date.now()-d)/1000;if(s<90)return"just now";const m=s/60;if(m<60)return Math.round(m)+" min ago";const h=m/60;if(h<36)return Math.round(h)+" h ago";return Math.round(h/24)+" days ago"}
async function loadUpdated(){
  const repo=guessRepo(); if(!repo) return;
  try{const r=await fetch(`https://api.github.com/repos/${repo}/commits?per_page=1`);const j=await r.json();
    const d=new Date(j[0].commit.committer.date);$("#lvUpd").textContent="Site updated "+ago(d);$("#lvUpd").title=d.toLocaleString();}catch(_){}
}
async function loadCitations(){
  const p=data.profile; const orcid=(String(p.orcid).match(/\d{4}-\d{4}-\d{4}-\d{3}[\dX]/)||[])[0];
  const dois=data.publications.map(x=>String(x.doi||"").trim().toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//,"")).filter(Boolean);
  let author=null, works=[];
  try{ if(orcid){const r=await fetch(`https://api.openalex.org/authors/orcid:${orcid}`);if(r.ok)author=await r.json()} }catch(_){}
  try{ for(let i=0;i<dois.length;i+=50){const chunk=dois.slice(i,i+50).join("|");
      const r=await fetch(`https://api.openalex.org/works?filter=doi:${encodeURIComponent(chunk)}&per_page=50&select=doi,cited_by_count,publication_year,counts_by_year`);
      if(r.ok){const j=await r.json();works=works.concat(j.results||[])}} }catch(_){}
  works.forEach(w=>{if(w.doi)live.cites[w.doi.toLowerCase().replace(/^https?:\/\/doi\.org\//,"")]=w.cited_by_count});
  const wc=works.map(w=>w.cited_by_count||0).sort((a,b)=>b-a);
  const hFromWorks=wc.filter((c,i)=>c>=i+1).length, i10w=wc.filter(c=>c>=10).length, sumW=wc.reduce((a,b)=>a+b,0);
  let byYear={};
  if(author&&author.counts_by_year) author.counts_by_year.forEach(r=>byYear[r.year]=(byYear[r.year]||0)+r.cited_by_count);
  else works.forEach(w=>(w.counts_by_year||[]).forEach(r=>byYear[r.year]=(byYear[r.year]||0)+r.cited_by_count));
  const yrs=Object.keys(byYear).map(Number).sort();
  const lo=yrs.length?Math.max(yrs[0],new Date().getFullYear()-6):0;
  const series=[];if(yrs.length)for(let y=lo;y<=new Date().getFullYear();y++)series.push({year:y,c:byYear[y]||0});
  if(author||works.length){
    const cites=Math.max(author?author.cited_by_count||0:0,sumW);
    live.metrics={cites, h:Math.max(author?.summary_stats?.h_index||0,hFromWorks), i10:Math.max(author?.summary_stats?.i10_index||0,i10w),
      works:Math.max(author?author.works_count||0:0,works.length), byYear:series,
      when:new Date().toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})};
    live.state="ready";
  } else live.state="error";
  const r=route(); if(r==="home"||r==="publications") render();
}

function pubListHtml(){
  const q=pubQuery.toLowerCase();

  const list=data.publications.map((x,i)=>({...x,i})).filter(x=>(pubFilter==="all"||x.type===pubFilter)&&(!q||(x.title+x.authors+x.venue).toLowerCase().includes(q)));

    out+=`<div class="section"><div class="section-head"><h2>${TYPE_LAB[t][1]}</h2><span class="aside">${g.length}</span></div>`;
    let n=0;
    g.forEach(x=>{
      n++;
      const doi=String(x.doi||"").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//,"");
      const links=[];
      if(doi) links.push(`<a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener">DOI: ${esc(doi)}</a>`);
      if(safeUrl(x.link)) links.push(`<a href="${esc(x.link)}" target="_blank" rel="noopener">Link</a>`);
      const cn=doi?live.cites[doi.toLowerCase()]:undefined;
      out+=`<div class="pub"><div class="lab">[${TYPE_LAB[t][0]}.${n}]</div><div>
        <div class="ti">${doi?`<a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(x.title)}</a>`:esc(x.title)}</div>
        <div class="au">${boldMe(x.authors)}${x.year?` (${esc(x.year)})`:""}${cn>0?`<span class="cites" title="Live citation count from OpenAlex">Cited by ${cn}</span>`:""}</div>
        <div class="ve">${esc(x.venue)}</div>${links.length?`<div class="lk">${links.join(" · ")}</div>`:""}</div></div>`;
    });
    out+=`</div>`;
  }
  return out;
}

  if(!isOwner) return pageHead("Site admin","Sign in with your GitHub access token to edit this website.")+`<main><div class="wrap"><div class="panel" style="max-width:640px">
    <form id="login">
      <label class="f">GitHub repository (username/repository)</label><input id="lgRepo" required placeholder="yourname/yourname.github.io" value="${esc(guessRepo())}">

    </form>

  </div></div></main>`;
  const tabs=[["profile","Profile & About"],...Object.entries(SCHEMA).map(([k,v])=>[k,v.label]),["data","Backup / Restore"]];

    <div class="admin">
      <div class="admin-nav">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${adminTab===k?"on":""}">${esc(l)}${SCHEMA[k]?`<span class="count">${data[k].length}</span>`:""}</button>`).join("")}</div>
      <div class="panel" id="panel"></div>

}
function fieldHtml(path,f,val){
  const [key,label,kind,extra]=f;
  const id=`f_${path}_${key}`;
  let ctl;
  if(kind==="textarea") ctl=`<textarea data-path="${path}" data-key="${key}" rows="${extra||4}">${esc(val)}</textarea>`;
  else if(kind==="select") ctl=`<select data-path="${path}" data-key="${key}">${extra.map(([v,l])=>`<option value="${v}" ${v===val?"selected":""}>${l}</option>`).join("")}</select>`;
  else ctl=`<input data-path="${path}" data-key="${key}" value="${esc(val)}">`;
  return `<div><label class="f">${esc(label)}</label>${ctl}</div>`;
}
function panelHtml(){
  if(adminTab==="profile"){

      <div class="photo-edit">${photoHtml()}<div><label class="btn ghost sm" style="display:inline-block">Upload photo<input type="file" accept="image/*" id="photoIn" hidden></label> ${p.photo?`<button class="btn ghost sm" id="photoAdj">Adjust position</button> <button class="btn danger sm" id="photoDel">Remove</button>`:""}<div style="font-size:.85rem;color:var(--muted);margin-top:6px">After choosing a photo you can drag it to center your face and zoom in or out.</div></div></div>

  }
  if(adminTab==="data"){

      <p>Copy a full backup of your site content, or paste one back in to restore it.</p>

      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost" id="copyJson">Copy backup</button><button class="btn ghost" id="loadJson">Load from box</button><button class="btn danger" id="resetCv">Reset to original CV content</button></div>
      <div id="jmsg" style="margin-top:8px;font-size:.9rem"></div>`;
  }
  const S=SCHEMA[adminTab], arr=data[adminTab];
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${esc(S.label)}</h2><button class="btn" id="addItem">+ Add new</button></div>
    <p style="color:var(--muted);font-size:.9rem">Click an entry to edit it. Use ↑ ↓ to change the order shown on the site.</p>
    ${arr.map((it,i)=>`<div class="item"><div class="item-head" data-open="${i}"><span class="ttl">${esc(S.title(it)||"(untitled)")}</span>
      <span class="acts"><button class="btn ghost sm" data-up="${i}" ${i===0?"disabled":""}>↑</button><button class="btn ghost sm" data-down="${i}" ${i===arr.length-1?"disabled":""}>↓</button><button class="btn danger sm" data-del="${i}">Delete</button></span></div>
      ${openItem===i?`<div class="item-body"><div class="row2">${S.fields.map(f=>fieldHtml(adminTab+"."+i,f,it[f[0]])).join("")}</div></div>`:""}</div>`).join("")||"<p>No entries yet.</p>"}`;
}
function setStatus(msg,cls){const s=$("#st");if(!s)return;s.textContent=msg;s.className="status "+(cls||"")}
function refreshStatus(){
  dirty()?setStatus("Unsaved changes","dirty"):setStatus("All changes saved","ok");
}
function bindAdmin(){
  if(loadState==="loading") return;
  if(!isOwner){ const f=$("#login"); if(f) f.onsubmit=doLogin; return; }
  $("#logout").onclick=()=>{try{localStorage.removeItem(LS_KEY)}catch(_){ } gh=null;isOwner=false;render()};
  const panel=$("#panel"); panel.innerHTML=panelHtml(); refreshStatus();
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;openItem=null;render()});
  $("#save").onclick=save;
  $("#discard").onclick=()=>{data=JSON.parse(saved);render()};
  panel.oninput=e=>{
    const t=e.target; if(!t.dataset||!t.dataset.path) return;
    const [sec,idx]=t.dataset.path.split(".");
    const obj= sec==="profile"?data.profile:data[sec][+idx];
    obj[t.dataset.key]=t.value; refreshStatus();
    if(sec!=="profile"){const h=t.closest(".item").querySelector(".ttl");h.textContent=SCHEMA[sec].title(obj)||"(untitled)"}
  };
  panel.onchange=panel.oninput;
  panel.onclick=e=>{
    const b=e.target.closest("button,[data-open]"); if(!b) return;
    const arr=data[adminTab];
    if(b.id==="addItem"){arr.unshift(clone(SCHEMA[adminTab].blank));openItem=0;rerenderPanel();return}
    if(b.dataset.up){e.stopPropagation();const i=+b.dataset.up;[arr[i-1],arr[i]]=[arr[i],arr[i-1]];openItem=null;rerenderPanel();return}
    if(b.dataset.down){e.stopPropagation();const i=+b.dataset.down;[arr[i+1],arr[i]]=[arr[i],arr[i+1]];openItem=null;rerenderPanel();return}
    if(b.dataset.del){e.stopPropagation();confirmBox("Delete this entry?",()=>{arr.splice(+b.dataset.del,1);openItem=null;rerenderPanel()});return}
    if(b.dataset.open!==undefined && b.tagName!=="BUTTON"){const i=+b.dataset.open;openItem=openItem===i?null:i;rerenderPanel();return}
    if(b.id==="photoAdj"){openCropper(data.profile.photo);return}
    if(b.id==="photoDel"){data.profile.photo="";rerenderPanel();return}
    if(b.id==="copyJson"){navigator.clipboard.writeText(JSON.stringify(data)).then(()=>$("#jmsg").textContent="Copied.",()=>{$("#jsonbox").select();$("#jmsg").textContent="Select-all done — press Ctrl/Cmd+C."});return}
    if(b.id==="loadJson"){try{const d=JSON.parse($("#jsonbox").value);if(!d.profile||!Array.isArray(d.publications))throw 0;data=normalize(d);rerenderPanel();$("#jmsg").textContent="Loaded. Click Save & publish to make it live."}catch(_){$("#jmsg").textContent="That doesn't look like a valid backup."}return}
    if(b.id==="resetCv"){confirmBox("Replace all content with the original CV version? (Not saved until you click Save & publish.)",()=>{data=clone(DEFAULT);rerenderPanel()});return}
  };
  bindPhotoInput();
}
function rerenderPanel(){$("#panel").innerHTML=panelHtml();refreshStatus();
  document.querySelectorAll("[data-tab]").forEach(b=>{const k=b.dataset.tab;const c=b.querySelector(".count");if(c&&data[k])c.textContent=data[k].length});
  bindPhotoInput();
}
function bindPhotoInput(){const pi=$("#photoIn"); if(pi) pi.onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)openCropper(URL.createObjectURL(f))}}
function openCropper(src){
  const img=new Image();
  img.onload=()=>{
    const V=300, OUT=480;
    const bg=document.createElement("div");bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" style="max-width:380px"><h3 style="margin-top:0">Position your photo</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:.92rem">Drag the picture to center it inside the circle. Use the slider (or mouse wheel) to zoom.</p>
      <div class="crop-view"><img alt=""><div class="crop-ring"></div></div>
      <div class="crop-zoom"><span>−</span><input type="range" min="1" max="4" step="0.01" value="1"><span>+</span></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-x>Cancel</button><button class="btn gold" data-ok>Use photo</button></div></div>`;
    document.body.appendChild(bg);
    const view=bg.querySelector(".crop-view"), el=bg.querySelector(".crop-view img"), range=bg.querySelector("input[type=range]");
    el.src=src; el.style.width=img.naturalWidth+"px"; el.style.height=img.naturalHeight+"px";
    const vw=()=>view.clientWidth||V;
    let base=Math.max(V/img.naturalWidth,V/img.naturalHeight), zoom=1;
    let x=(V-img.naturalWidth*base)/2, y=(V-img.naturalHeight*base)/2;
    const sc=()=>base*zoom;
    function clamp(){const w=img.naturalWidth*sc(),h=img.naturalHeight*sc();x=Math.min(0,Math.max(V-w,x));y=Math.min(0,Math.max(V-h,y))}
    function draw(){clamp();const r=vw()/V;el.style.transform=`translate(${x*r}px,${y*r}px) scale(${sc()*r})`}
    function setZoom(z){z=Math.max(1,Math.min(4,z));const cx=(V/2-x)/sc(),cy=(V/2-y)/sc();zoom=z;x=V/2-cx*sc();y=V/2-cy*sc();range.value=z;draw()}
    draw();
    let drag=null;
    view.addEventListener("pointerdown",e=>{drag={px:e.clientX,py:e.clientY,x,y};view.setPointerCapture(e.pointerId)});
    view.addEventListener("pointermove",e=>{if(!drag)return;const r=V/vw();x=drag.x+(e.clientX-drag.px)*r;y=drag.y+(e.clientY-drag.py)*r;draw()});
    view.addEventListener("pointerup",()=>drag=null);view.addEventListener("pointercancel",()=>drag=null);
    view.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:1/1.08))},{passive:false});
    range.oninput=()=>setZoom(+range.value);
    bg.onclick=e=>{
      if(e.target.dataset.ok!==undefined){
        const c=document.createElement("canvas");c.width=c.height=OUT;const k=OUT/V;
        const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,OUT,OUT);
        ctx.drawImage(img,x*k,y*k,img.naturalWidth*sc()*k,img.naturalHeight*sc()*k);
        data.profile.photo=c.toDataURL("image/jpeg",.88);bg.remove();rerenderPanel();
      } else if(e.target===bg||e.target.dataset.x!==undefined) bg.remove();
    };
  };
  img.onerror=()=>alertMsg("That file couldn't be opened as an image.");
  img.src=src;
}
function alertMsg(m){const s=$("#st");if(s){s.textContent=m;s.className="status err"}}
function resizeImage(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const c=document.createElement("canvas");c.width=c.height=Math.min(max,s);c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
function confirmBox(msg,yes){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><p style="margin-top:0">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-x>Cancel</button><button class="btn danger" data-y>Confirm</button></div></div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target.dataset.y!==undefined){yes();bg.remove()}else if(e.target===bg||e.target.dataset.x!==undefined)bg.remove()};
}
function b64(str){const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
async function ghApi(path,opt={}){
  const r=await fetch("https://api.github.com/repos/"+gh.repo+path,{...opt,headers:{"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json",...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||("GitHub error "+r.status));e.status=r.status;throw e}
  return j;
}
function guessRepo(){
  const h=location.hostname; if(!h.endsWith(".github.io")) return "";
  const user=h.split(".")[0]; const seg=location.pathname.split("/").filter(Boolean)[0];
  return user+"/"+(seg&&!seg.includes(".")?seg:h);
}
function fromB64(b){const bin=atob(b.replace(/\s/g,""));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
async function loadFromRepo(){
  const f=await ghApi("/contents/content.json?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now(),{cache:"no-store"});
  data=normalize(JSON.parse(fromB64(f.content))); saved=JSON.stringify(data); loadedSha=f.sha;
}
async function doLogin(e){
  e.preventDefault();
  const m=$("#lgMsg"); m.textContent="Checking…"; m.className="status dirty";
  gh={repo:$("#lgRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""),branch:$("#lgBranch").value.trim()||"main",token:$("#lgTok").value.trim()};
  try{
    const info=await ghApi("");
    if(!(info.permissions&&info.permissions.push)) throw new Error("This token can't write to that repository.");
    try{localStorage.setItem(LS_KEY,JSON.stringify(gh))}catch(_){}
    try{await loadFromRepo()}catch(_){}
    isOwner=true; render();
  }catch(err){gh=null;m.textContent=err.status===404?"Repository not found, or the token can't see it.":err.status===401?"That token isn't valid.":err.message;m.className="status err"}
}
async function save(force){
  const btn=$("#save");btn.disabled=true;setStatus("Saving…","dirty");
  try{
    let sha;
    try{sha=(await ghApi("/contents/content.json?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now(),{cache:"no-store"})).sha}catch(err){if(err.status!==404)throw err}
    if(!force && loadedSha && sha && sha!==loadedSha){
      btn.disabled=false; setStatus("The site was changed somewhere else since you opened the editor","err");
      confirmBox("Your site was saved from another tab or device after this editor opened. Saving now would overwrite those newer changes. Overwrite anyway? (Choose Cancel, then reload this page to get the latest version.)",()=>save(true));
      return;
    }
    const json=JSON.stringify(data,null,1);
    const res=await ghApi("/contents/content.json",{method:"PUT",body:JSON.stringify({message:"Update site content",content:b64(json),branch:gh.branch,...(sha?{sha}:{})})});
    loadedSha=res.content&&res.content.sha; saved=JSON.stringify(data);
    setStatus("Saved — the public site updates in 1–2 minutes","ok");
  }catch(err){setStatus("Save failed: "+(err.status===401?"token expired or invalid — sign out and in again":err.status===409?"the site changed meanwhile — reload this page and try again":err.message),"err")}
  btn.disabled=false;
}
function normalize(d){
  const out=clone(DEFAULT);
  out.profile={...out.profile,...(d.profile||{})};
  for(const k of Object.keys(SCHEMA)) if(Array.isArray(d[k])) out[k]=d[k];
  return out;
}

/* ===================== BOOT ===================== */
render();
window.addEventListener("beforeunload",e=>{if(isOwner&&dirty()){e.preventDefault();e.returnValue=""}});
(async()=>{
  try{const g=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(g&&g.token&&g.repo){gh=g;isOwner=true}}catch(_){}
  let ok=false;
  if(gh){ try{await loadFromRepo(); ok=true}catch(_){} }
  if(!ok){
    try{
      const r=await fetch("content.json?v="+Date.now(),{cache:"no-store"});
      if(r.ok){data=normalize(await r.json());saved=JSON.stringify(data)}
    }catch(_){}
  }
  loadState="ready";
  render();
  startLive();
})();
</script>
